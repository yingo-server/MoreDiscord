<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coalchat — 云母质感聊天</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="assets/css/tokens.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/base.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/components.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/layout.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/admin.css" media="print" onload="this.media='all'">
<script>/* critical：主题与降级（无 JS 媒体查询切换时保证深色可读） */document.documentElement.dataset.theme='dark';</script>
<style>
/* —— critical CSS 内联：核心 tokens + app shell 布局骨架（首屏零阻塞） —— */
:root {
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-full: 9999px;
  --md-sys-typescale-font: "Segoe UI Variable Display","Segoe UI",system-ui,"HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
  --md-easing-standard: cubic-bezier(.2,0,0,1);
  --md-duration-short: 200ms;
}
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --md-sys-color-surface: #1a1c1e;
  --md-sys-color-surface-dim: #111314;
  --md-sys-color-surface-container: #1e2022;
  --md-sys-color-surface-container-high: #282a2d;
  --md-sys-color-on-surface: #e2e2e5;
  --md-sys-color-on-surface-variant: #a5a8ad;
  --md-sys-color-outline-variant: #3a3d41;
  --md-sys-color-primary: #e8a33d;
  --md-sys-color-on-primary: #221b00;
}
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--md-sys-typescale-font);
  background: var(--md-sys-color-surface-dim);
  color: var(--md-sys-color-on-surface);
  font-size: 14px;
  overflow: hidden;
}
#app { position: relative; height: 100dvh; }
.boot-splash {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  color: var(--md-sys-color-on-surface-variant);
}
.boot-splash .boot-mark {
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--md-sys-color-primary);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 20px; color: var(--md-sys-color-on-primary);
}
.boot-splash .boot-hint { font-size: 12px; }
.app-shell { display: grid; grid-template-columns: 72px 300px 1fr; height: 100dvh; overflow: hidden; visibility: hidden; }
.app-shell.ready { visibility: visible; }
@media (max-width: 1024px) { .app-shell { grid-template-columns: 64px 280px 1fr; } }
@media (max-width: 600px) { .app-shell { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <div class="boot-splash" id="boot-splash">
    <div class="boot-mark">C</div>
    <div class="boot-hint">正在加载 Coalchat…</div>
  </div>
</div>
<noscript><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">需要启用 JavaScript 才能使用 Coalchat</div></noscript>
<script type="module" src="assets/js/main.js" defer></script>
</body>
</html>
